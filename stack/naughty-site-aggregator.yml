version: "3.8"

# Naughty Site Aggregator: one search page across twelve free tube sites with
# length slider, channel and keyword filters, performer/channel dropdowns with
# pictures, favorite performers and optional per-user MeTube downloads. It
# fetches metadata only (titles, lengths, thumbnails, links); videos play in
# each site's own embed player and nothing is re-hosted.
#
# Source: https://github.com/yo-repo87/naughty-site-aggregator
#
# If you publish it outside your LAN, turn on accounts with REQUIRE_LOGIN=true,
# or put it behind a reverse proxy with authentication (e.g. an Nginx Proxy
# Manager access list or Cloudflare Access).
services:
  naughty-site-aggregator:
    image: ghcr.io/yo-repo87/naughty-site-aggregator:latest
    container_name: naughty-site-aggregator
    restart: unless-stopped
    ports:
      - "${WEB_PORT}:8000/tcp"
    # Performer/channel dropdown lists (rebuilt daily), kept across updates
    volumes:
      - naughty-site-aggregator-data:/data
    # Optional accounts (sign-in, passkeys, 2FA, settings and favorites sync).
    # Leave DATABASE_URL empty to run search-only. DATA_KEY / INDEX_KEY: two
    # different 32-byte base64url keys - never change or lose them once
    # accounts exist.
    environment:
      DATABASE_URL: "${DATABASE_URL:-}"
      DB_SSL: "${DB_SSL:-prefer}"
      DATA_KEY: "${DATA_KEY:-}"
      INDEX_KEY: "${INDEX_KEY:-}"
      PUBLIC_URL: "${PUBLIC_URL:-}"
      REQUIRE_HTTPS: "${REQUIRE_HTTPS:-false}"
      REQUIRE_LOGIN: "${REQUIRE_LOGIN:-false}"
      ALLOW_REGISTRATION: "${ALLOW_REGISTRATION:-true}"
      # LAN MeTube addresses users may connect (host, host:port or CIDR). Empty = public only.
      METUBE_PRIVATE_HOSTS: "${METUBE_PRIVATE_HOSTS:-}"
      GOOGLE_CLIENT_ID: "${GOOGLE_CLIENT_ID:-}"
      GOOGLE_CLIENT_SECRET: "${GOOGLE_CLIENT_SECRET:-}"
      FACEBOOK_CLIENT_ID: "${FACEBOOK_CLIENT_ID:-}"
      FACEBOOK_CLIENT_SECRET: "${FACEBOOK_CLIENT_SECRET:-}"
      DISCORD_CLIENT_ID: "${DISCORD_CLIENT_ID:-}"
      DISCORD_CLIENT_SECRET: "${DISCORD_CLIENT_SECRET:-}"

volumes:
  naughty-site-aggregator-data:
