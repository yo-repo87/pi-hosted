version: "3.8"

# Naughty Site Aggregator: one search page across twelve free tube sites with
# length slider, channel and keyword filters, performer/channel dropdowns with
# pictures, favorites feed, watch later, saved-search alerts and optional
# per-user send-to (MeTube, JDownloader, webhook, Discord, ntfy). It fetches
# metadata only (titles, lengths, thumbnails, links); videos play in each
# site's own embed player and nothing is re-hosted.
#
# Source: https://github.com/yo-repo87/naughty-site-aggregator
#
# If you publish it outside your LAN, turn on accounts with REQUIRE_LOGIN=true,
# or put it behind a reverse proxy with authentication (e.g. an Nginx Proxy
# Manager access list or Cloudflare Access).
services:
  naughty-site-aggregator:
    image: ghcr.io/yo-repo87/naughty-site-aggregator:latest
    container_name: naughty-site-aggregator
    restart: unless-stopped
    ports:
      - "${WEB_PORT}:8000/tcp"
    volumes:
      # Performer/channel lists and the favorites feed cache, kept across updates
      - naughty-site-aggregator-data:/data
      # Optional plug-ins (sources/*.py, targets/*.py): set PLUGINS_PATH to a host folder
      - ${PLUGINS_PATH:-naughty-site-aggregator-plugins}:/plugins:ro
    # Optional accounts (sign-in, passkeys, 2FA, settings and favorites sync).
    # Leave DATABASE_URL empty to run search-only. DATA_KEY / INDEX_KEY: two
    # different 32-byte base64url keys - never change or lose them once
    # accounts exist.
    environment:
      DATABASE_URL: "${DATABASE_URL:-}"
      DB_SSL: "${DB_SSL:-prefer}"
      DATA_KEY: "${DATA_KEY:-}"
      INDEX_KEY: "${INDEX_KEY:-}"
      PUBLIC_URL: "${PUBLIC_URL:-}"
      REQUIRE_HTTPS: "${REQUIRE_HTTPS:-false}"
      REQUIRE_LOGIN: "${REQUIRE_LOGIN:-false}"
      ALLOW_REGISTRATION: "${ALLOW_REGISTRATION:-true}"
      ADMIN_EMAILS: "${ADMIN_EMAILS:-}"
      # LAN addresses users may send to (host, host:port or CIDR). Empty = public only.
      SEND_PRIVATE_HOSTS: "${SEND_PRIVATE_HOSTS:-}"
      ALERT_HOURS: "${ALERT_HOURS:-6}"
      FEED_REFRESH_HOURS: "${FEED_REFRESH_HOURS:-6}"
      # Bundled optional plug-ins to switch on (also switchable on the Admin tab)
      ENABLED_PLUGINS: "${ENABLED_PLUGINS:-}"
      GOOGLE_CLIENT_ID: "${GOOGLE_CLIENT_ID:-}"
      GOOGLE_CLIENT_SECRET: "${GOOGLE_CLIENT_SECRET:-}"
      FACEBOOK_CLIENT_ID: "${FACEBOOK_CLIENT_ID:-}"
      FACEBOOK_CLIENT_SECRET: "${FACEBOOK_CLIENT_SECRET:-}"
      DISCORD_CLIENT_ID: "${DISCORD_CLIENT_ID:-}"
      DISCORD_CLIENT_SECRET: "${DISCORD_CLIENT_SECRET:-}"

volumes:
  naughty-site-aggregator-data:
  naughty-site-aggregator-plugins:
